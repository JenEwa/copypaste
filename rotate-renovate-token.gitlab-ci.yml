# Rotates RENOVATE_TOKEN (a project access token) and stores the new value
# back in the project CI/CD variable of the same name.
#
# Requirements:
#   - RENOVATE_TOKEN: project access token, scope `api`, role Maintainer
#   - The variable is masked and protected (only exposed on protected branches)
#
# Runs:
#   - automatically from a pipeline schedule that sets ROTATE_TOKEN=true
#   - manually via the play button on any default-branch pipeline

rotate-renovate-token:
  image: alpine:3.20
  resource_group: renovate-token          # never run two rotations at once
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ROTATE_TOKEN == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true                 # pipeline doesn't wait on this job
  variables:
    TOKEN_LIFETIME_DAYS: "60"
    ROTATE_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/access_tokens/self/rotate"
    VARIABLE_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables/RENOVATE_TOKEN"
  before_script:
    - apk add --no-cache curl jq
  script:
    # 1. Work out the new expiry date (YYYY-MM-DD)
    - now=$(date +%s)
    - expires_at=$(date -u -d "@$(( now + TOKEN_LIFETIME_DAYS * 86400 ))" +%F)

    # 2. Rotate: GitLab revokes the current token and returns a new one
    - |
      new_token=$(
        curl --silent --fail --request POST \
          --header "PRIVATE-TOKEN: $RENOVATE_TOKEN" \
          "$ROTATE_URL?expires_at=$expires_at" \
        | jq --raw-output '.token // empty'
      )
    - '[ -n "$new_token" ] || { echo "Rotation failed"; exit 1; }'

    # 3. Save the new token in the CI variable. The old token is dead now,
    #    so this call must use the new one. Retry, because failing here
    #    loses the token.
    - |
      for attempt in 1 2 3 4 5; do
        if curl --silent --fail --request PUT \
             --header "PRIVATE-TOKEN: $new_token" \
             --form "value=$new_token" \
             "$VARIABLE_URL" > /dev/null
        then
          echo "RENOVATE_TOKEN rotated, expires $expires_at"
          exit 0
        fi
        echo "Saving the variable failed (attempt $attempt), retrying in 10 s"
        sleep 10
      done
    - echo "Token was rotated but NOT saved. Create a new token by hand." && exit 1
