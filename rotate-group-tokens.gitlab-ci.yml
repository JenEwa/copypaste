# Lives in a "token rotation" repo inside the dev_ops group.
# Rotates one read token per subgroup, plus the token that writes them.
#
# Tokens (all stored masked + protected):
#   Read tokens     one group access token per subgroup (dev_ops/ansible,
#                   dev_ops/tofu, ...), role Reporter,
#                   scopes `read_repository` + `self_rotate`.
#                   Each stored as a GROUP CI/CD variable on dev_ops,
#                   e.g. ANSIBLE_READER_TOKEN, TOFU_READ_TOKEN.
#   ROTATOR_TOKEN   group access token on dev_ops, scope `api`, role Owner
#                   (group CI/CD variables can only be written by Owners).
#                   Stored as a PROJECT CI/CD variable in this repo.
#
# New subgroup: create its read token + variable, add one entry to READ_TOKENS.
#
# Runs:
#   - automatically from a pipeline schedule that sets ROTATE_TOKEN=true
#   - manually via the play button on any default-branch pipeline

rotate-group-tokens:
  image: alpine:3.20
  resource_group: group-token-rotation    # never run two rotations at once
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ROTATE_TOKEN == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true                 # pipeline doesn't wait on this job
  variables:
    # <subgroup path, "/" written as %2F>=<variable name>, space separated
    READ_TOKENS: >-
      dev_ops%2Fansible=ANSIBLE_READER_TOKEN
      dev_ops%2Ftofu=TOFU_READ_TOKEN
    VARIABLE_GROUP: "dev_ops"             # holds the variables and ROTATOR_TOKEN
    TOKEN_LIFETIME_DAYS: "60"
  before_script:
    - apk add --no-cache curl jq
    - now=$(date +%s)
    - expires_at=$(date -u -d "@$(( now + TOKEN_LIFETIME_DAYS * 86400 ))" +%F)
    - |
      # rotate <group> <current-token>: prints the new token
      rotate() {
        curl --silent --show-error --fail --request POST \
          --header "PRIVATE-TOKEN: $2" \
          "$CI_API_V4_URL/groups/$1/access_tokens/self/rotate?expires_at=$expires_at" \
        | jq --raw-output '.token // empty'
      }

      # save <variable-url> <writer-token> <value>: retries, because
      # failing here loses the freshly rotated token
      save() {
        for attempt in 1 2 3 4 5; do
          curl --silent --show-error --fail --request PUT \
            --header "PRIVATE-TOKEN: $2" \
            --form "value=$3" \
            "$1" > /dev/null && return 0
          echo "Saving failed (attempt $attempt), retrying in 10 s"
          sleep 10
        done
        return 1
      }
  script:
    # 1. Each read token rotates itself, the rotator token saves it on dev_ops
    - |
      for entry in $READ_TOKENS; do
        group=${entry%%=*}
        variable=${entry#*=}

        new_token=$(rotate "$group" "$(printenv "$variable")" || true)
        [ -n "$new_token" ] || { echo "$variable rotation failed (group $group)"; exit 1; }

        save "$CI_API_V4_URL/groups/$VARIABLE_GROUP/variables/$variable" \
          "$ROTATOR_TOKEN" "$new_token" \
          || { echo "$variable rotated but NOT saved. Create it by hand."; exit 1; }

        echo "$variable rotated, expires $expires_at"
      done

    # 2. Rotator token: rotates itself and saves itself with its new value
    - |
      new_rotator=$(rotate "$VARIABLE_GROUP" "$ROTATOR_TOKEN" || true)
      [ -n "$new_rotator" ] || { echo "ROTATOR_TOKEN rotation failed"; exit 1; }
      save "$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables/ROTATOR_TOKEN" \
        "$new_rotator" "$new_rotator" \
        || { echo "ROTATOR_TOKEN rotated but NOT saved. Create it by hand."; exit 1; }
      echo "ROTATOR_TOKEN rotated, expires $expires_at"
