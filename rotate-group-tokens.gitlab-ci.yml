# Lives in a "token rotation" repo inside the dev_ops group.
# Rotates the shared read token and the token that writes it.
#
# Tokens (both group access tokens on dev_ops, both stored masked + protected):
#   GROUP_READ_TOKEN  role Reporter, scopes `read_repository` + `self_rotate`
#                     Can read every repo in dev_ops and its subgroups
#                     (ansible, tofu, ...).
#                     Stored as a GROUP CI/CD variable on dev_ops, so every
#                     repo below dev_ops inherits it.
#   ROTATOR_TOKEN     scope `api`, role allowed to edit group CI/CD variables
#                     Stored as a PROJECT CI/CD variable in this repo.
#
# Runs:
#   - automatically from a pipeline schedule that sets ROTATE_TOKEN=true
#   - manually via the play button on any default-branch pipeline

rotate-group-tokens:
  image: alpine:3.20
  resource_group: group-token-rotation    # never run two rotations at once
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ROTATE_TOKEN == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true                 # pipeline doesn't wait on this job
  variables:
    GROUP_ID: "CHANGE_ME"                 # numeric ID of the dev_ops group
    TOKEN_LIFETIME_DAYS: "60"
  before_script:
    - apk add --no-cache curl jq
    - now=$(date +%s)
    - expires_at=$(date -u -d "@$(( now + TOKEN_LIFETIME_DAYS * 86400 ))" +%F)
    - rotate_url="$CI_API_V4_URL/groups/$GROUP_ID/access_tokens/self/rotate"
    - |
      # rotate <current-token>: prints the new token
      rotate() {
        curl --silent --fail --request POST \
          --header "PRIVATE-TOKEN: $1" \
          "$rotate_url?expires_at=$expires_at" \
        | jq --raw-output '.token // empty'
      }

      # save <variable-url> <writer-token> <value>: retries, because
      # failing here loses the freshly rotated token
      save() {
        for attempt in 1 2 3 4 5; do
          curl --silent --fail --request PUT \
            --header "PRIVATE-TOKEN: $2" \
            --form "value=$3" \
            "$1" > /dev/null && return 0
          echo "Saving failed (attempt $attempt), retrying in 10 s"
          sleep 10
        done
        return 1
      }
  script:
    # 1. Read token: rotates itself, the rotator token saves it on dev_ops
    - |
      new_read=$(rotate "$GROUP_READ_TOKEN")
      [ -n "$new_read" ] || { echo "GROUP_READ_TOKEN rotation failed"; exit 1; }
      save "$CI_API_V4_URL/groups/$GROUP_ID/variables/GROUP_READ_TOKEN" \
        "$ROTATOR_TOKEN" "$new_read" \
        || { echo "GROUP_READ_TOKEN rotated but NOT saved. Create it by hand."; exit 1; }
      echo "GROUP_READ_TOKEN rotated, expires $expires_at"

    # 2. Rotator token: rotates itself and saves itself with its new value
    - |
      new_rotator=$(rotate "$ROTATOR_TOKEN")
      [ -n "$new_rotator" ] || { echo "ROTATOR_TOKEN rotation failed"; exit 1; }
      save "$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables/ROTATOR_TOKEN" \
        "$new_rotator" "$new_rotator" \
        || { echo "ROTATOR_TOKEN rotated but NOT saved. Create it by hand."; exit 1; }
      echo "ROTATOR_TOKEN rotated, expires $expires_at"
